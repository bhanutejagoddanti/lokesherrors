apiVersion: apps/v1
kind: Deployment

metadata:
  name: workday-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: workday-backend

  template:
    metadata:
      labels:
        app: workday-backend

    spec:
      containers:
        - name: backend
          image: workday-backend:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 4001

          envFrom:
            - secretRef:
                name: workday-backend-secret

          env:
            - name: NODE_OPTIONS
              value: "--dns-result-order=ipv4first"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3